<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Path-aware <base>, set before any relative URL is parsed.
    // In production the app lives at /lagoon/ and must work even when loaded as
    // /lagoon with no trailing slash (CloudFront doesn't redirect), so anchor to
    // "/lagoon/". Anywhere else (e.g. a local server at the web root) use a
    // relative base so it just works. JS module imports resolve against the module
    // URL, not <base>, so they're unaffected either way.
    (function () {
      var base = document.createElement("base");
      base.href = location.pathname.indexOf("/lagoon") === 0 ? "/lagoon/" : "./";
      document.head.appendChild(base);
    })();
  </script>
  <title>Hove Lagoon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7e6cf">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a1f12">
  <!-- Standalone iOS PWA: black-translucent lets the web view extend under the status bar so
       we can paint it (the #statusbar backdrop). Note: it forces WHITE status-bar text, hence
       the warm-DARK backdrop in both themes so the clock/battery stay readable. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    /* Dark is the default; .light forces light; with no class we follow the OS. */
    :root {
      color-scheme: dark;
      /* Warm-dusk canvas: teal stays the interactive accent, neutrals are tinted warm to
         harmonise with the sunset splash/icon, --sun is the amber "moment" highlight. */
      --bg:#100e0b; --surface:#1a1712; --surface-2:#14110c; --border:#2f2921;
      --text:#eae6df; --muted:#a49c8f;
      --accent:#2dd4bf; --accent-ink:#06251f; --sun:#f6b24a;
      --chip-bg:#13241f; --chip-border:#2dd4bf44; --chip-text:#cfeee7;
      --good:#34d399; --warn:#fbbf24; --danger:#f87171; --danger-border:#5a2f2f;
      --stale-bg:#3a2a12; --stale-text:#fbbf24;
      --selected-bg:#16302b; --shadow:rgba(0,0,0,.4);
      --hdr:linear-gradient(120deg,#2a1f12,#14100b 60%);
    }
    :root.light {
      color-scheme: light;
      --bg:#f5f2ec; --surface:#ffffff; --surface-2:#efeae1; --border:#dbd4c8;
      --text:#201d18; --muted:#6f685d;
      --accent:#0d9488; --accent-ink:#ffffff; --sun:#cf7d15;
      --chip-bg:#e6faf6; --chip-border:#99e6dc; --chip-text:#0f766e;
      --good:#059669; --warn:#b45309; --danger:#dc2626; --danger-border:#f3c2c2;
      --stale-bg:#fef3c7; --stale-text:#92400e;
      --selected-bg:#d3f5ee; --shadow:rgba(0,0,0,.12);
      --hdr:linear-gradient(120deg,#f7e6cf,#f5f2ec 60%);
    }
    @media (prefers-color-scheme: light) {
      :root:not(.dark) {
        color-scheme: light;
        --bg:#f5f2ec; --surface:#ffffff; --surface-2:#efeae1; --border:#dbd4c8;
        --text:#201d18; --muted:#6f685d;
        --accent:#0d9488; --accent-ink:#ffffff; --sun:#cf7d15;
        --chip-bg:#e6faf6; --chip-border:#99e6dc; --chip-text:#0f766e;
        --good:#059669; --warn:#b45309; --danger:#dc2626; --danger-border:#f3c2c2;
        --stale-bg:#fef3c7; --stale-text:#92400e;
        --selected-bg:#d3f5ee; --shadow:rgba(0,0,0,.12);
        --hdr:linear-gradient(120deg,#f7e6cf,#f5f2ec 60%);
      }
    }

    * { box-sizing: border-box; }
    /* App-shell layout: body is a fixed-height flex column (header · scrolling main · nav),
       so the DOCUMENT never scrolls — only <main> does. That removes the iOS momentum-scroll
       stale-paint bug that plagued a position:fixed nav (v29/v36 tried translateZ + will-change
       + backface-visibility compositor hints; they rotted across iOS updates). With no document
       scroll there's no momentum surface for an in-flow nav to be left behind by. */
    /* iOS standalone full-screen (black-translucent) mis-reports 100vh/100dvh, leaving a gap
       under the bottom nav. -webkit-fill-available fills the ACTUAL available height on iOS;
       100dvh is the fallback for everything else. html must be sized for it to resolve. */
    html { height:-webkit-fill-available; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Roboto,system-ui,sans-serif;
      height:100dvh; height:-webkit-fill-available; display:flex; flex-direction:column; overflow:hidden; }
    /* Warm-dark backdrop behind the white-text iOS status bar (black-translucent). Fixed over
       the safe-area strip; zero height (invisible) where there's no inset. #2a1f12 = the dark
       header's start, so it's seamless in dark mode and a deliberate warm sliver in light. */
    #statusbar { position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top);
      background:#2a1f12; z-index:10; }
    /* padding-top clears the status bar (content sits below it, viewport-fit=cover). */
    header { flex:none; display:flex; justify-content:space-between; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; font-weight:600; font-size:17px; border-bottom:1px solid var(--border); background:var(--hdr); }
    header .accent { color:var(--accent); }
    .icon-btn { background:none; border:none; color:var(--muted); font-size:19px; line-height:1; cursor:pointer; padding:4px 6px; }
    .disc-toggle { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; }
    .disc-toggle[hidden] { display:none; }
    .disc-seg { display:flex; align-items:center; gap:4px; background:none; border:none; border-radius:7px; padding:4px 10px; font-size:13px; font-weight:600; line-height:1; color:var(--text); cursor:pointer; opacity:.5; }
    .disc-seg .disc-ico { font-size:15px; }
    .disc-seg.active { background:var(--accent); color:var(--accent-ink); opacity:1; }
    /* The only scroll container. min-height:0 lets the flex item shrink so it scrolls
       internally instead of growing the body; overscroll-behavior stops rubber-band chaining. */
    main { flex:1; min-height:0; position:relative; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
      width:100%; max-width:560px; margin:0 auto; padding:14px 14px 24px; }
    h2 { margin:0 0 12px; }
    /* In-flow bottom bar (not position:fixed anymore — see the app-shell note above).
       Pad by the iOS home-indicator inset (viewport-fit=cover) so the buttons sit above
       the system gesture area, otherwise taps near the bottom can trigger the iOS
       app-switcher/close bar instead of the nav. */
    nav { flex:none; display:flex; background:var(--surface-2); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom); }
    nav[hidden] { display:none; } /* type selector above beats the UA [hidden] rule, so restore it (hidden on the sign-in page) */
    nav button { flex:1; background:none; border:none; color:var(--muted); padding:14px 12px; font-size:13px; }
    nav button.active { color:var(--accent); }
    .stale { background:var(--stale-bg); color:var(--stale-text); font-size:12px; padding:6px 10px; border-radius:8px; margin-bottom:10px; }
    .muted { color:var(--muted); } .err { color:var(--danger); }
    button.primary { background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:10px 14px; font-weight:600; }
    input { width:100%; padding:11px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); margin-bottom:10px; }
    /* Cold-open splash: photo band on a dusk backdrop, filling the content area below the
       header. Lives in #view so the header/nav stay in place; splash.js fades it on load. */
    #splash { position:absolute; inset:0; overflow:hidden; z-index:1;
      background:linear-gradient(180deg,#45525f 0%,#5f5f5c 34%,#8a5f3c 64%,#b06f36 82%,#1a120b 100%);
      transition:opacity .3s ease; }
    #splash.leaving { opacity:0; }
    .splash-band { position:absolute; left:0; width:100%; height:auto; top:50%; transform:translateY(-54%);
      -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
      mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%); }
    .splash-dots { position:absolute; left:0; right:0; bottom:40px; display:flex; gap:9px; justify-content:center; }
    .splash-dots i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.9);
      animation:splash-pulse 1.2s ease-in-out infinite; }
    .splash-dots i:nth-child(2){ animation-delay:.18s } .splash-dots i:nth-child(3){ animation-delay:.36s }
    @keyframes splash-pulse { 0%,100%{ opacity:.25; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-3px) } }
    @media (prefers-reduced-motion:reduce){ .splash-dots i{ animation:none; opacity:.7 } }
  </style>
  <script>
    /* Apply saved theme before first paint (no flash). */
    (function () {
      var t = localStorage.getItem("lagoon.theme");
      if (t === "light" || t === "dark") document.documentElement.classList.add(t);
    })();
  </script>
</head>
<body>
  <!-- Warm-dark backdrop behind the (white-text) iOS status bar. Height is the safe-area inset,
       so it's invisible where there's no inset (Android/desktop use theme-color instead). -->
  <div id="statusbar"></div>
  <header>
    <span>🏄 <span class="accent">Hove Lagoon</span></span>
    <!-- Discipline switch (wake ⇄ SUP). Hidden by default; app.js reveals + wires it for
         all logged-in users. -->
    <div id="disc-toggle" class="disc-toggle" role="group" aria-label="Activity" hidden>
      <button class="disc-seg" data-disc="wake" aria-label="Wakeboard" title="Wakeboard"><span class="disc-ico">🏄</span>Wake</button>
      <button class="disc-seg" data-disc="sup" aria-label="Paddle boarding" title="Paddle boarding"><span class="disc-ico">🛶</span>SUP</button>
    </div>
    <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
  </header>
  <main id="view">
    <div id="splash" aria-hidden="true">
      <img class="splash-band" src="splash.webp" alt="" width="1290" height="850">
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>
  </main>
  <nav id="nav" hidden>
    <button data-route="lastminute" hidden><span class="nav-emoji">🔥</span> Last-minute</button>
    <button data-route="agenda" class="active">Availability</button>
    <button data-route="account">Bookings</button>
  </nav>
  <script>
    // Load the entry module via JS so its URL resolves against the <base> set above — not
    // speculatively by the preload scanner, which fetches a static `src` against the raw
    // document URL and 404s /js/app.js when the app is opened at /lagoon (no trailing slash).
    (function () {
      var s = document.createElement("script");
      s.type = "module";
      s.src = new URL("js/app.js", document.baseURI).href;
      document.head.appendChild(s);
    })();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
